# Builds a release from its tag (never from uncommitted work) and attaches the packages, each with
# its .sha256:
#   EZSlicer-Engine-<version>.zip          the headless engine (resin_slicer), for jET Hangar
#   EZSlicer-Windows-Portable-<version>.zip the app, with its own Python
# Tags come from `npm run release -- <patch|minor|major> --push`.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Tag matches the version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != package.json v$version" }
      - name: Install pytest
        run: python -m pip install pytest
      - name: Unit and contract tests
        run: python -m pytest -q
      - name: Install
        run: npm ci
      - name: App package
        shell: powershell  # Windows PowerShell 5.1, as on the team's PCs
        run: ./tools/package_release.ps1
      # After the app: its vite build empties dist\, so the engine goes to its own folder.
      - name: Engine package
        run: python tools/package_engine.py --out release-engine
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem dist, release-engine -File | Where-Object { $_.Name -match '^EZSlicer-(Engine|Windows-Portable)-.*\.zip(\.sha256)?$' } | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" @assets --verify-tag --title "EZSlicer ${{ github.ref_name }}" --notes-from-tag
